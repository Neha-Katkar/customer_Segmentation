
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Segmentation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #eef2f7;
        }

        .container {
            max-width: 480px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1e293b;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Customer Segmentation</h1>

        <p class="subtitle">
            K-Means Clustering Prediction
        </p>

        <form method="POST" action="/">

            <label for="annual_income">
                Annual Income (in thousands)
            </label>

            <input
                type="number"
                id="annual_income"
                name="annual_income"
                min="0"
                step="any"
                placeholder="Example: 80"
                value="{{ income }}"
                required
            >

            <label for="spending_score">
                Spending Score (1-100)
            </label>

            <input
                type="number"
                id="spending_score"
                name="spending_score"
                min="1"
                max="100"
                step="any"
                placeholder="Example: 75"
                value="{{ spending }}"
                required
            >

            <button type="submit">
                Predict Customer Cluster
            </button>

        </form>

        {% if prediction is not none %}
            <div class="result">
                <h2>Prediction Successful!</h2>
                <p>Your customer belongs to:</p>
                <h2>Cluster {{ prediction }}</h2>
            </div>
        {% endif %}

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

    </div>
</body>
</html>
